databaseChangeLog:

  - changeSet:
      id: 01-create-payment-webhook-table
      author: angelo-b
      changes:

        - createSequence:
            sequenceName: payment_webhook_seq_generator
            startValue: 1
            incrementBy: 50

        - createTable:
            tableName: payment_webhook
            columns:

              - column:
                  name: id
                  type: BIGINT
                  defaultValueSequenceNext: payment_webhook_seq_generator
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_payment_webhook
                    nullable: false

              - column:
                  name: provider
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: provider_event_id
                  type: VARCHAR(225)
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: failure_message
                  type: VARCHAR(500)

              - column:
                  name: received_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: payment_webhook
            columnNames: provider, provider_event_id
            constraintName: uk_provider_provider_event_id

      rollback:
        - dropTable:
            tableName: payment_webhook
            cascadeConstraints: true

        - dropSequence:
            sequenceName: payment_webhook_seq_generator
