databaseChangeLog:

  - changeSet:
      id: 01-add-venue-active-flag
      author: angelo-b
      changes:

        - addColumn:
            tableName: venue
            columns:
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 02-add-seat-active-flag
      author: angelo-b
      changes:

        - addColumn:
            tableName: seat
            columns:
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false