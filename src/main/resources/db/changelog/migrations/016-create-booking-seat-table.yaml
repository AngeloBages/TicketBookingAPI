databaseChangeLog:

# ============================================================
  # BOOKING_SEAT SEQUENCE
  # ============================================================

  - changeSet:
      id: 03-create-booking-seat-sequence
      author: angelo-b
      changes:

        - createSequence:
            sequenceName: booking_seat_seq_generator
            startValue: 1
            incrementBy: 50

      rollback:
        - dropSequence:
            sequenceName: booking_seat_seq_generator


  # ============================================================
  # BOOKING_SEAT
  # ============================================================

  - changeSet:
      id: 04-create-booking-seat
      author: angelo-b
      changes:

        - createTable:
            tableName: booking_seat
            columns:

              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true

              - column:
                  name: booking_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: event_seat_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: booking_seat
            baseColumnNames: booking_id
            referencedTableName: booking
            referencedColumnNames: id
            constraintName: fk_booking_seat_booking

        - addForeignKeyConstraint:
            baseTableName: booking_seat
            baseColumnNames: event_seat_id
            referencedTableName: event_seat
            referencedColumnNames: id
            constraintName: fk_booking_seat_event_seat

        - addUniqueConstraint:
            tableName: booking_seat
            columnNames: booking_id, event_seat_id
            constraintName: uk_booking_event_seat

      rollback:
        - dropTable:
            tableName: booking_seat
